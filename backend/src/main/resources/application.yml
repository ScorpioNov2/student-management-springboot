server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend

  # Database Connection Configuration (SQLite)
  datasource:
    url: ${DB_URL:jdbc:sqlite:students.db}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

  jooq:
    sql-dialect: ${JOOQ_SQL_DIALECT:SQLITE}

logging:
  level:
    root: INFO
    org.jooq.tools.LoggerListener: ${LOGGING_LEVEL_JOOQ:INFO}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
